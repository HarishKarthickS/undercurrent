services:
  gateway:
    ports: []
  caddy:
    image: caddy:2.10-alpine
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_started
    networks: [internal]
  retention:
    build: { context: ., dockerfile: docker/api/Dockerfile, target: runtime }
    command: ["sh", "-c", "while true; do npm run retention:run; sleep 86400; done"]
    environment:
      DATABASE_URL: postgresql://undercurrent:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/undercurrent
      NODE_ENV: production
      DEPLOYMENT_MODE: closed_demo
      DEMO_TERMS_SHA256: ${DEMO_TERMS_SHA256:?DEMO_TERMS_SHA256 is required}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
volumes:
  caddy-data:
  caddy-config:
