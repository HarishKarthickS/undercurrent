services:
  - type: web
    name: undercurrent-demo
    runtime: node
    region: singapore
    plan: free
    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise omit vite and other build-time tooling from npm ci.
    buildCommand: npm ci --include=dev && VITE_API_BASE_URL= npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_MODE
        value: closed_demo
      - key: ENABLE_DEV_FIXTURES
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: DEMO_TERMS_VERSION
        value: closed-demo-v1
      - key: DATABASE_URL
        fromDatabase:
          name: undercurrent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: undercurrent-cache
          property: connectionString
      - key: DEMO_TERMS_SHA256
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Hostname follows the service name above. Override only for a custom domain
      # or if Render appends a suffix because the name is already taken.
      - key: PUBLIC_APP_URL
        value: https://undercurrent-demo.onrender.com

  - type: keyvalue
    name: undercurrent-cache
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

databases:
  - name: undercurrent-db
    region: singapore
    plan: free
    databaseName: undercurrent
    user: undercurrent
